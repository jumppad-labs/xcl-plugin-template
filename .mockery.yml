# Mockery v3 configuration, run with `make generate`. It generates a strict
# double of each client interface into a mocks package beside it. The provider
# unit tests use the double of client/files in place of the real disk, so any
# call the test does not expect fails it.
#
# When you add a client package, add its interfaces under packages and run
# `make generate`.
dir: '{{.InterfaceDir}}/mocks'
filename: 'mock_{{ snakecase .InterfaceName }}.go'
structname: Mock{{.InterfaceName}}
pkgname: mocks
template: testify
template-data:
  unroll-variadic: true
packages:
  github.com/jumppad-labs/xcl-plugin-template/client/files:
    interfaces:
      Files: {}
